name: Unity-iPhone
options:
  bundleIdPrefix: com.example
configs:
  Debug: debug
  Release: release
  ReleaseForProfiling: release
  ReleaseForRunning: release
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "13.0"
    DEVELOPMENT_TEAM: ABCDE12345
targets:
  Unity-iPhone:
    type: application
    platform: iOS
    sources: [Classes]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.game
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_ENTITLEMENTS: Unity-iPhone/Unity-iPhone.entitlements
        CODE_SIGN_STYLE: Manual
      configs:
        Debug:
          PROVISIONING_PROFILE_SPECIFIER: "Game Development"
          CODE_SIGN_IDENTITY: "Apple Development"
        Release:
          PROVISIONING_PROFILE_SPECIFIER: "Game AppStore"
          CODE_SIGN_IDENTITY: "Apple Distribution"
    dependencies:
      - target: OneSignalNotificationServiceExtension
        embed: true
  OneSignalNotificationServiceExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: OneSignalNotificationServiceExtension
        excludes: ["*.plist", "*.entitlements"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.game.OneSignalNotificationServiceExtension
        INFOPLIST_FILE: OneSignalNotificationServiceExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: OneSignalNotificationServiceExtension/OneSignalNotificationServiceExtension.entitlements
        IPHONEOS_DEPLOYMENT_TARGET: "11.0"
        CODE_SIGN_STYLE: Manual
      configs:
        Debug:
          PROVISIONING_PROFILE_SPECIFIER: "Game NSE Development"
          CODE_SIGN_IDENTITY: "Apple Development"
        Release:
          PROVISIONING_PROFILE_SPECIFIER: "Game NSE AppStore"
          CODE_SIGN_IDENTITY: "Apple Distribution"
